# Xooteq Mail behind the VPS's nginx. workspace-setup.sh writes it filled in
# (domain and port) to /opt/postal/nginx-xooteq-mail.conf; copy that to
# /etc/nginx/sites-available/ (README, Xooteq Mail). certbot --nginx adds TLS.
server {
    listen 80;
    server_name MAIL_DOMAIN;

    # Attachments go up through here.
    client_max_body_size 60m;

    # Live updates (server-sent events): no buffering, long reads.
    location ~ ^/api/.*/events$ {
        proxy_pass http://127.0.0.1:5200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:5200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
