# The forms endpoint behind the VPS's nginx. Copy to
# /etc/nginx/sites-available/forms.conf with MAIL_DOMAIN's parent replaced
# (README, Forms); certbot --nginx adds TLS and the redirect from port 80.
server {
    listen 80;
    server_name forms.FORMS_DOMAIN;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
