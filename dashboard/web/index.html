<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F3F3F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Every company's mail in one inbox: read, write, rules, auto-replies and AI drafts." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Kept on a home screen: its own window, its own icon, its own name.
         The status bar is left to iOS ("default"), so its text stays readable
         in both themes; the layout keeps clear of it with the safe-area insets. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Xooteq Mail" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Xooteq Mail</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
